<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080e20">
  <meta name="description" content="Starfall Miner — a playable Godot space mining incremental. Steer a ship, shatter planets, and build your mining empire.">
  <title>$GODOT_PROJECT_NAME</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#060b17;color:#edf3f5;font-family:system-ui,sans-serif;touch-action:none}
    body{display:grid;place-items:center}canvas{display:block;width:100%;height:100%;outline:none}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:radial-gradient(ellipse at 50% 40%,#172039,#080e20 65%);z-index:2}
    .sigil{width:38px;height:38px;transform:rotate(45deg);border:2px solid #ffcf83;border-radius:5px;box-shadow:0 0 55px #79f3ce22;margin-bottom:14px}.sigil:after{content:"";display:block;width:2px;height:60px;background:#79f3ce;margin:-12px auto}
    h1{font-size:30px;letter-spacing:5px;margin:0}small{font-size:10px;letter-spacing:4px;color:#788a9f}progress{appearance:none;width:220px;height:4px;border:0;border-radius:4px;margin:20px 0 0}progress::-webkit-progress-bar{background:#263348;border-radius:4px}progress::-webkit-progress-value{background:#79f3ce;border-radius:4px}progress::-moz-progress-bar{background:#79f3ce}#message{font-size:12px;color:#788a9f;text-align:center;max-width:320px;line-height:1.6;padding:0 16px}
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="Starfall Miner game. Use WASD or arrows to steer in manual mode, Space to fire, 1 2 3 to switch weapons, Tab to switch autopilot, E for overdrive, P to pause."></canvas>
  <div id="loading"><div class="sigil"></div><h1>STARFALL</h1><small>MINER / DEEP SPACE OPERATIONS</small><progress id="progress" max="100" value="0"></progress><p id="message">Preparing your mining ship…</p></div>
  <noscript>This Godot game needs JavaScript enabled.</noscript>
  <script src="$GODOT_URL"></script>
  <script>
    const engine = new Engine($GODOT_CONFIG);
    const message = document.getElementById('message');
    const progress = document.getElementById('progress');
    const missing = Engine.getMissingFeatures({threads:$GODOT_THREADS_ENABLED});
    function fail(error){message.textContent=error.message||String(error);progress.hidden=true;console.error(error)}
    if(missing.length){fail('This browser is missing '+missing.join(', ')+'. Try a recent Chrome, Firefox, or Safari.')}else{
      engine.startGame({canvas:document.getElementById('canvas'),onProgress:(current,total)=>{
        if(total){progress.value=current/total*100;message.textContent='Loading flight systems… '+Math.round(current/total*100)+'%'}
      }}).then(()=>{document.getElementById('loading').remove();document.getElementById('canvas').focus();window.starfallReady=true}).catch(fail);
    }
    document.addEventListener('contextmenu',event=>event.preventDefault());
    document.addEventListener('visibilitychange',()=>{if(document.hidden&&engine.requestQuit){/* Godot persists on focus loss. */}});
  </script>
</body>
</html>
